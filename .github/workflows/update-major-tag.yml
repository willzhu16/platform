name: update-major-tag

# Implements the version-pin contract (D-18, spec 01 §2.4): consumers reference the
# moving major tag `@v1`. Given a release (e.g. v1.4.2), this force-moves `v1` to that
# commit, so consumers get fixes automatically and breakage only ever arrives by an
# explicit major bump.
#
# Dispatch only. promote-canary.yml calls it once canary-worker has run the release, and a
# person can call it to move v1 at once, for an urgent fix or to roll back. It used to fire
# on `release: published` as well, and because release-please publishes with
# AUTOMATION_TOKEN that event fired on every release, moving v1 before anything had run it.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z release tag to move the major tag onto
        required: true
        type: string

permissions:
  contents: write

jobs:
  retag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve and guard the release tag
        id: tag
        # Only a plain vX.Y.Z tag may move a major tag (D-18) — an unexpected ref
        # (e.g. a component-prefixed tag like platform-v1.1.0) must never force-push
        # a bogus major tag. The raw value goes through env, never into the script.
        env:
          RAW_TAG: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
        run: |
          if echo "$RAW_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "tag=$RAW_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "::error::'$RAW_TAG' is not a vX.Y.Z release tag"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.tag.outputs.tag }}
      - name: Move major tag
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          MAJOR=$(echo "$TAG" | cut -d. -f1) # v1.4.2 -> v1
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "${MAJOR}"
          git push -f origin "${MAJOR}"
