name: security-reusable

# Reusable security pipeline (spec 02). Callers name their job `security`, so the checks
# surface as the frozen names `security / gitleaks`, `security / semgrep`, `security /
# osv` — reserved in spec 01 §2.3 and required by every project's main ruleset. All three
# scanners run UNAUTHENTICATED: this workflow takes no secrets by design, so it is
# callable from public and private repos alike with zero access configuration.
#
# Language-agnostic by construction: gitleaks scans text, semgrep selects rules per file
# type, osv-scanner reads any supported lockfile. One workflow serves TS and Python — no
# security-python.yml exists (D-21's per-language split applies only to CI toolchains).
#
# The shared gitleaks config and semgrep rules live in this same `platform` repo. Because
# a reusable workflow's `github.*` context reflects the CALLER, we locate platform via the
# `job.workflow_*` context — the repo and commit of the workflow file defining this job,
# i.e. platform at the exact ref the consumer pinned (`@v1`). spec 09 hardens this further.

on:
  workflow_call:
    inputs:
      semgrep-config:
        type: string
        default: '' # optional extra rules appended to the shared set
      osv-lockfiles:
        type: string
        default: 'auto' # explicit lockfile paths if auto-detection misfires; skips coverage

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  GITLEAKS_VERSION: '8.30.1'
  SEMGREP_VERSION: '1.168.0'
  # Bumped as reviewable PRs in platform; Renovate-managed from spec 09.

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (full history for diff-scope and push scans)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Resolve platform repo ref
        id: platform
        # A reusable workflow's `github.*` context is the CALLER's, so read the `job`
        # context: `job.workflow_repository`/`job.workflow_sha` identify the repo + commit
        # of the workflow file defining THIS job — platform at the consumer's pinned ref.
        run: |
          echo "repository=${{ job.workflow_repository }}" >> "$GITHUB_OUTPUT"
          echo "ref=${{ job.workflow_sha }}" >> "$GITHUB_OUTPUT"
      - name: Fetch shared gitleaks config and the secrets gate from platform
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ steps.platform.outputs.repository }}
          ref: ${{ steps.platform.outputs.ref }}
          sparse-checkout: |
            security/gitleaks.toml
            scripts/sops-check.sh
          sparse-checkout-cone-mode: false
          path: .artemis-platform
      # A step in this job rather than a job of its own, on purpose. A new job means a new
      # check name, and no ruleset requires it, so it could fail while the PR stayed
      # mergeable — the gate would be decoration. `security / gitleaks` is already required
      # everywhere, which is the same reason diff coverage lives inside `ci / test`.
      #
      # It runs BEFORE the scan because it is instant and needs no download, and because a
      # plaintext secret committed under secrets/ is the more certain finding of the two:
      # gitleaks infers from credential shapes, this reads whether the file is sops output.
      - name: Verify every file under secrets/ is encrypted
        id: sops
        run: bash .artemis-platform/scripts/sops-check.sh .
      - name: Unencrypted secret (on finding)
        if: failure() && steps.sops.conclusion == 'failure'
        run: |
          {
            echo '### 🔒 a file under secrets/ is not encrypted'
            echo ''
            echo 'It is plaintext in the working tree. If it has already been committed and'
            echo 'pushed, treat the value as leaked: rotate it first, then purge history.'
            echo ''
            echo 'Encrypt in place, then commit the encrypted file:'
            echo ''
            echo '    sops -e -i secrets/<file>'
            echo ''
            echo 'If the recipient is still the template placeholder, configure it once with'
            echo 'platform scripts/sops-bootstrap.sh and verify before committing.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Install gitleaks (verified against published checksums)
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSLf -o "$tarball" "${base}/${tarball}"
          curl -sSLf -o checksums.txt "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep "  ${tarball}$" checksums.txt | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan (PR = diff range; push = Git history)
        id: scan
        run: |
          config=.artemis-platform/security/gitleaks.toml
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            gitleaks detect --source . --config "$config" --redact --no-banner \
              --log-opts "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            gitleaks detect --source . --config "$config" --redact --no-banner
          fi
      # Scoped to the scan step: `failure()` alone also fires when the secrets gate above
      # fails, and printing the gitleaks runbook for an unencrypted file sends the reader to
      # the wrong procedure.
      - name: Leak-response runbook (on finding)
        if: failure() && steps.scan.conclusion == 'failure'
        run: |
          {
            echo "### 🔑 gitleaks found a potential secret"
            echo ""
            echo "Treat as real. Follow the leak-response runbook: **rotate the credential"
            echo "first**, then purge it from git history — never the reverse (public repos"
            echo "are scraped within minutes)."
            echo ""
            echo "Runbook: https://github.com/willzhu16/platform/blob/v1/handbook/runbooks/leak-response.md"
          } >> "$GITHUB_STEP_SUMMARY"

  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code to scan
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Resolve platform repo ref
        id: platform
        # A reusable workflow's `github.*` context is the CALLER's, so read the `job`
        # context: `job.workflow_repository`/`job.workflow_sha` identify the repo + commit
        # of the workflow file defining THIS job — platform at the consumer's pinned ref.
        run: |
          echo "repository=${{ job.workflow_repository }}" >> "$GITHUB_OUTPUT"
          echo "ref=${{ job.workflow_sha }}" >> "$GITHUB_OUTPUT"
      - name: Fetch shared semgrep rules from platform
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ steps.platform.outputs.repository }}
          ref: ${{ steps.platform.outputs.ref }}
          sparse-checkout: security/semgrep
          sparse-checkout-cone-mode: false
          path: .artemis-platform
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          # Not 3.15: semgrep-core crashes there ("failed to create domain backup thread").
          # renovate/default.json holds this below 3.14; selftest's real scan is the test.
          python-version: '3.13'
      - name: Install semgrep (OSS engine)
        run: pip install "semgrep==${SEMGREP_VERSION}"
      - name: Scan
        env:
          SEMGREP_CONFIG: ${{ inputs.semgrep-config }}
        run: |
          extra=()
          if [ -n "$SEMGREP_CONFIG" ]; then
            extra=(--config "$SEMGREP_CONFIG")
          fi
          semgrep scan \
            --config .artemis-platform/security/semgrep \
            "${extra[@]}" \
            --error --metrics=off --no-git-ignore \
            --exclude .artemis-platform

  osv:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Resolve platform repo ref
        id: platform
        # A reusable workflow's `github.*` context is the CALLER's, so read the `job`
        # context: `job.workflow_repository`/`job.workflow_sha` identify the repo + commit
        # of the workflow file defining THIS job: platform at the consumer's pinned ref.
        run: |
          echo "repository=${{ job.workflow_repository }}" >> "$GITHUB_OUTPUT"
          echo "ref=${{ job.workflow_sha }}" >> "$GITHUB_OUTPUT"
      - name: Fetch the coverage check from platform
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ steps.platform.outputs.repository }}
          ref: ${{ steps.platform.outputs.ref }}
          sparse-checkout: scripts/osv-coverage.sh
          sparse-checkout-cone-mode: false
          path: .artemis-platform
      # A scan that cannot read a lockfile reports no advisories in it, which passes. These two
      # steps make it prove what it read: list every package it sees, then compare that with a
      # count of each lockfile (scripts/osv-coverage.sh). Steps, not a job, for the reason the
      # secrets gate gives above: `security / osv` is already required everywhere.
      #
      # selftest.yml runs the same two steps against the fixtures with the same scanner pin, so
      # a scanner bump that changes this output fails in platform before v1 carries it out.
      - name: List every package osv-scanner reads
        if: inputs.osv-lockfiles == 'auto'
        # It exits 1 whenever it finds an advisory. The scan below is the step that reports
        # those; this one only has to leave its package list behind.
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --format=json
            --all-packages
            --output-file=.artemis-osv-packages.json
            --recursive
            ./
      - name: Verify osv-scanner read every lockfile
        id: coverage
        if: inputs.osv-lockfiles == 'auto'
        run: bash .artemis-platform/scripts/osv-coverage.sh .artemis-osv-packages.json
      - name: Unread lockfile (on finding)
        if: failure() && steps.coverage.conclusion == 'failure'
        run: |
          {
            echo '### 🔍 osv-scanner did not read every lockfile'
            echo ''
            echo 'Advisories in the packages it skipped were never checked, so a pass would be'
            echo 'meaningless. The usual cause is a lockfile format the pinned scanner cannot'
            echo 'fully parse yet: hold the package-manager update that introduced it in'
            echo 'renovate/default.json until a scanner release reads it.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: OSV scan (lockfiles)
        # 'auto' scans the repo recursively (osv-scanner finds every supported lockfile);
        # pass explicit paths via the osv-lockfiles input when auto-detection misfires.
        # An in-repo osv-scanner.toml may ignore specific advisory IDs (spec 02 §3.3).
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --recursive
            ${{ inputs.osv-lockfiles == 'auto' && './' || inputs.osv-lockfiles }}
