name: acceptance-reusable

# Reusable acceptance gate: every acceptance criterion in the PR's task packet must have a
# passing test that claims it.
#
# `review-protocol.md` has always called "an acceptance criterion with no covering test" a
# blocking finding. The thing doing the finding was a human reading a diff, which is the work
# this whole system exists to remove. This is that one rule, mechanised, using athena's
# `acceptance` CLI — the same tool athena runs against its own committed packet.
#
# The packet is the linked issue. Link it the ordinary way (`Closes #42` in the PR body) and
# this finds it; pass `packet-issue` to name one explicitly.
#
# Criteria carry ids (`- AC-1: ...`) and a test claims one by writing `AC-1:` in its name.
# See athena/task-packet.md. A criterion that can only be checked by hand gets no id, so the
# gate never claims coverage it does not have.
#
# The consumer's `test` script must write a vitest JSON report to reports/tests.json. The
# cf-worker-app template does; a repo that does not will fail with a clear message rather
# than passing vacuously.

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: '24'
      working-directory:
        type: string
        default: '.'
      athena-ref:
        type: string
        default: 'v1' # the moving athena major tag (D-18)
      packet-issue:
        description: Packet issue number. Defaults to the issue this PR closes.
        type: string
        default: ''
      require-packet:
        description: >-
          Fail when no packet issue is linked. Default false, matching task-packet.md:
          "Small fixes may skip the packet — they never skip the gates." Turn it on once
          every change in this repo is expected to carry one.
        type: boolean
        default: false
      report-path:
        description: Vitest JSON report the `test` script writes, relative to working-directory.
        type: string
        default: 'reports/tests.json'

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Find the task packet
        id: packet
        env:
          GH_TOKEN: ${{ github.token }}
          PACKET_INPUT: ${{ inputs.packet-issue }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REQUIRE: ${{ inputs.require-packet }}
        run: |
          issue="$PACKET_INPUT"
          if [ -z "$issue" ] && [ -n "$PR_NUMBER" ]; then
            # The issue the PR closes is the packet. Nothing else is guessed at: a PR that
            # links no issue has no packet, which is a documented state, not an error.
            issue="$(gh pr view "$PR_NUMBER" --json closingIssuesReferences \
              --jq '.closingIssuesReferences[0].number // empty')"
          fi
          if [ -z "$issue" ]; then
            if [ "$REQUIRE" = 'true' ]; then
              echo "::error::no packet issue linked. Add 'Closes #<packet>' to the PR body."
              exit 1
            fi
            echo '::notice::no packet issue linked; skipping the acceptance gate'
            echo 'found=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh issue view "$issue" --json body --jq .body > "${RUNNER_TEMP}/packet.md"
          echo "::notice::checking acceptance criteria from issue #${issue}"
          echo 'found=true' >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        if: steps.packet.outputs.found == 'true'
        with:
          package_json_file: ${{ inputs.working-directory }}/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.packet.outputs.found == 'true'
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm
          cache-dependency-path: ${{ inputs.working-directory }}/pnpm-lock.yaml
      - name: Install and test
        if: steps.packet.outputs.found == 'true'
        working-directory: ${{ inputs.working-directory }}
        run: |
          pnpm install --frozen-lockfile
          pnpm test
      - name: Check the test report exists
        if: steps.packet.outputs.found == 'true'
        working-directory: ${{ inputs.working-directory }}
        env:
          REPORT: ${{ inputs.report-path }}
        run: |
          if [ ! -s "$REPORT" ]; then
            echo "::error::${REPORT} was not written. The \`test\` script must emit a vitest"
            echo "::error::JSON report, e.g. --reporter=default --reporter=json --outputFile=${REPORT}"
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.packet.outputs.found == 'true'
        with:
          repository: ${{ github.repository_owner }}/athena
          ref: ${{ inputs.athena-ref }}
          path: .athena-src
      - name: Install athena
        if: steps.packet.outputs.found == 'true'
        working-directory: .athena-src
        run: pnpm install --frozen-lockfile
      - name: Every criterion has a passing test
        if: steps.packet.outputs.found == 'true'
        working-directory: .athena-src
        env:
          WORKDIR: ${{ inputs.working-directory }}
          REPORT: ${{ inputs.report-path }}
        run: pnpm acceptance "${RUNNER_TEMP}/packet.md" "${GITHUB_WORKSPACE}/${WORKDIR}/${REPORT}"
