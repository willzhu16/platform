name: release-platform

# release-please for platform itself (spec 01 §6.2, D-14/D-18). On every push to main it
# maintains a running "chore: release vX.Y.Z" PR from Conventional Commits; merging that
# PR (a human-only action) tags vX.Y.Z and cuts a GitHub Release with a changelog. This
# workflow then moves the `canary` tag onto the release. `v1`, the tag every repo pins,
# follows only after canary-worker has run it: promote-canary.yml makes that call.

on:
  push:
    branches: [main]

permissions:
  contents: write # release-please's tags and the canary tag
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        # A PAT or App token here, not GITHUB_TOKEN. GitHub never triggers workflows from
        # events created by the default token, so a release PR opened with it arrives with
        # no checks and cannot merge under a ruleset that requires any. Falls back to
        # github.token when AUTOMATION_TOKEN is unset, which keeps the old behaviour
        # (checks pending until a human closes and reopens the PR) rather than failing.
        with:
          token: ${{ secrets.AUTOMATION_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Move the canary tag onto the release
        # Not v1: 1.13.1 broke `security / semgrep` in every repo the moment v1 moved onto it.
        # canary-worker's hourly canary.yml runs the shared workflows at @canary beside @v1,
        # and promote-canary.yml moves v1 once nothing passing on v1 fails on canary.
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          sha="$(gh api "repos/$GH_REPO/git/ref/tags/$TAG" --jq .object.sha)"
          if gh api "repos/$GH_REPO/git/ref/tags/canary" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/canary" -f sha="$sha" -F force=true >/dev/null
          else
            gh api -X POST "repos/$GH_REPO/git/refs" -f ref=refs/tags/canary -f sha="$sha" >/dev/null
          fi
          echo "canary -> $TAG ($sha); v1 moves when promote-canary.yml clears it"
