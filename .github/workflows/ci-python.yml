name: ci-python-reusable

# Reusable Python PR pipeline (spec 01, D-21). A one-for-one mirror of ci.yml that
# emits the IDENTICAL frozen check names (`ci / lint`, `ci / typecheck`, `ci / test`,
# `ci / commits`) — that identity is the multi-language contract: rulesets, the review
# protocol, and release gating never know or care which language a repo is.
#
# Python has no package.json-scripts idiom worth imitating, so the jobs call the tools
# directly through uv (ruff / pyright / pytest). A project customises behaviour through
# tool config files (ruff.toml, pyrightconfig.json, pytest ini), not by renaming
# commands. The `commits` job is shared verbatim with ci.yml.

on:
  workflow_call:
    inputs:
      python-version:
        type: string
        default: '3.13'
      working-directory:
        type: string
        default: '.'
      enforce-conventional-commits:
        type: boolean
        default: true
      diff-coverage-min:
        description: >-
          Minimum coverage of the lines this pull request changed, as a percentage. Whole-repo
          coverage hides new untested code — add 300 untested lines to a large repo and the
          total barely moves. Set '0' to disable. Skipped when no coverage.xml is produced.
        type: string
        default: '90'

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: ${{ inputs.python-version }}
      - name: Install
        working-directory: ${{ inputs.working-directory }}
        run: uv sync --frozen
      - name: Lint
        working-directory: ${{ inputs.working-directory }}
        run: |
          uv run ruff check .
          uv run ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: ${{ inputs.python-version }}
      - name: Install
        working-directory: ${{ inputs.working-directory }}
        run: uv sync --frozen
      - name: Typecheck
        working-directory: ${{ inputs.working-directory }}
        run: uv run pyright

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Diff coverage needs the base branch to compare against; the default shallow
          # clone has no merge base to diff from.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: ${{ inputs.python-version }}
      - name: Install
        working-directory: ${{ inputs.working-directory }}
        run: uv sync --frozen
      - name: Test
        # --cov-report=xml alongside the default terminal report: the XML is cobertura, which
        # is what the diff-coverage step below reads. The floor itself lives in the project's
        # [tool.coverage.report].
        working-directory: ${{ inputs.working-directory }}
        run: uv run pytest --cov --cov-report=term --cov-report=xml
      - name: Diff coverage
        # Runs inside `ci / test` rather than as its own check, so it needs no new required
        # status name and cannot be skipped by a repo that never adds it to a ruleset.
        if: github.event_name == 'pull_request' && inputs.diff-coverage-min != '0'
        working-directory: ${{ inputs.working-directory }}
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          MIN: ${{ inputs.diff-coverage-min }}
        run: |
          if [ ! -f coverage.xml ]; then
            echo "::notice::coverage.xml not found; skipping diff coverage."
            exit 0
          fi
          git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          uvx diff-cover coverage.xml             --compare-branch "origin/${BASE_REF}"             --fail-under "$MIN"

  commits:
    if: inputs.enforce-conventional-commits && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6.2.1
        with:
          configFile: .commitlintrc.json # shipped by templates; extends
                                          # @commitlint/config-conventional
