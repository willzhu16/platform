name: ci-reusable

# Reusable TS PR pipeline (spec 01). Callers name their job `ci`, so the checks
# surface as `ci / lint`, `ci / typecheck`, `ci / test`, `ci / commits` — the frozen
# check names that rulesets, the review protocol (spec 04), and release gating (spec
# 07) reference by exact string. Renaming a check name is a breaking change (D-18).
#
# This workflow knows nothing about tools: it calls the package.json scripts `lint`,
# `typecheck`, and `test` (the script contract, spec 01 §2.1). A project swaps tools
# by changing those scripts, never this file.

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: '24'
      package-manager:
        type: string
        default: 'pnpm' # 'pnpm' | 'npm'
      working-directory:
        type: string
        default: '.'
      enforce-conventional-commits:
        type: boolean
        default: true
      diff-coverage-min:
        description: >-
          Minimum coverage of the lines this pull request changed, as a percentage. Whole-repo
          coverage hides new untested code — add 300 untested lines to a large repo and the
          total barely moves. Set '0' to disable. Skipped entirely when the project emits no
          cobertura report, so adopting it is opt-in per repo.
        type: string
        default: '90'

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  PACKAGE_MANAGER: ${{ inputs.package-manager }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: inputs.package-manager == 'pnpm'
        with:
          # Resolve the pnpm version from the project's packageManager field — the
          # default looks at the CALLER repo root, which may have no package.json.
          package_json_file: ${{ inputs.working-directory }}/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}
          # Must be lockfile path(s), never a directory — setup-node hashes the matched
          # files and fails the job when the pattern resolves to no file.
          cache-dependency-path: |
            ${{ inputs.working-directory }}/pnpm-lock.yaml
            ${{ inputs.working-directory }}/package-lock.json
      - name: Install
        working-directory: ${{ inputs.working-directory }}
        run: |
          case "$PACKAGE_MANAGER" in pnpm|npm) ;; *) exit 1 ;; esac
          if [ "$PACKAGE_MANAGER" = "pnpm" ]; then
            pnpm install --frozen-lockfile
          else
            npm ci
          fi
      - name: Lint
        working-directory: ${{ inputs.working-directory }}
        run: |
          case "$PACKAGE_MANAGER" in pnpm|npm) ;; *) exit 1 ;; esac
          "$PACKAGE_MANAGER" run lint

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: inputs.package-manager == 'pnpm'
        with:
          # Resolve the pnpm version from the project's packageManager field — the
          # default looks at the CALLER repo root, which may have no package.json.
          package_json_file: ${{ inputs.working-directory }}/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}
          # Must be lockfile path(s), never a directory — setup-node hashes the matched
          # files and fails the job when the pattern resolves to no file.
          cache-dependency-path: |
            ${{ inputs.working-directory }}/pnpm-lock.yaml
            ${{ inputs.working-directory }}/package-lock.json
      - name: Install
        working-directory: ${{ inputs.working-directory }}
        run: |
          case "$PACKAGE_MANAGER" in pnpm|npm) ;; *) exit 1 ;; esac
          if [ "$PACKAGE_MANAGER" = "pnpm" ]; then
            pnpm install --frozen-lockfile
          else
            npm ci
          fi
      - name: Typecheck
        working-directory: ${{ inputs.working-directory }}
        run: |
          case "$PACKAGE_MANAGER" in pnpm|npm) ;; *) exit 1 ;; esac
          "$PACKAGE_MANAGER" run typecheck

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Diff coverage needs the base branch to compare against; the default shallow
          # clone has no merge base to diff from.
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: inputs.package-manager == 'pnpm'
        with:
          # Resolve the pnpm version from the project's packageManager field — the
          # default looks at the CALLER repo root, which may have no package.json.
          package_json_file: ${{ inputs.working-directory }}/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}
          # Must be lockfile path(s), never a directory — setup-node hashes the matched
          # files and fails the job when the pattern resolves to no file.
          cache-dependency-path: |
            ${{ inputs.working-directory }}/pnpm-lock.yaml
            ${{ inputs.working-directory }}/package-lock.json
      - name: Install
        working-directory: ${{ inputs.working-directory }}
        run: |
          case "$PACKAGE_MANAGER" in pnpm|npm) ;; *) exit 1 ;; esac
          if [ "$PACKAGE_MANAGER" = "pnpm" ]; then
            pnpm install --frozen-lockfile
          else
            npm ci
          fi
      - name: Test
        working-directory: ${{ inputs.working-directory }}
        run: |
          case "$PACKAGE_MANAGER" in pnpm|npm) ;; *) exit 1 ;; esac
          "$PACKAGE_MANAGER" run test
      - name: Diff coverage
        # Runs inside `ci / test` rather than as its own check, so it needs no new required
        # status name and cannot be skipped by a repo that simply never adds it to a ruleset.
        # A repo that emits no cobertura report skips this with a notice.
        if: github.event_name == 'pull_request' && inputs.diff-coverage-min != '0'
        working-directory: ${{ inputs.working-directory }}
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          MIN: ${{ inputs.diff-coverage-min }}
        run: |
          report=coverage/cobertura-coverage.xml
          if [ ! -f "$report" ]; then
            echo "::notice::${report} not found; skipping diff coverage."
            echo "::notice::Add 'cobertura' to the coverage reporters in vitest.config.ts to enable it."
            exit 0
          fi
          git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          pipx run diff-cover "$report"             --compare-branch "origin/${BASE_REF}"             --fail-under "$MIN"

  commits:
    if: inputs.enforce-conventional-commits && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6.2.1
        with:
          configFile: .commitlintrc.json # shipped by templates; extends
                                          # @commitlint/config-conventional
