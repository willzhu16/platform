name: cadence

# Opens the recurring-maintenance issues on schedule (spec 05 §2.5). Each issue body is its
# checklist, read from handbook/cadences.md when the run starts, so editing the handbook is
# the whole change: until 2026-11-03 this file kept its own copy, and the two had drifted.
# Opening an issue closes the previous open one of the same cadence, since an unworked
# checklist only hides the next. One cron per cadence; GitHub fires a separate event per
# matching cron, so the 1st of a quarter opens both the monthly and the quarterly issue.
#
# Test without waiting for a cron: Actions → cadence → Run workflow → pick a cadence
# (acceptance test 2). Re-running the same period is a no-op (it dedupes on title).

on:
  schedule:
    - cron: '0 6 * * 1'          # weekly    — Mondays 06:00 UTC, fleet-audit only
    - cron: '0 6 1 * *'          # monthly   — the 1st, 06:00 UTC
    - cron: '0 6 1 1,4,7,10 *'   # quarterly — 1st of Jan/Apr/Jul/Oct, 06:00 UTC
  workflow_dispatch:
    inputs:
      cadence:
        description: Which cadence issue to open (manual test)
        type: choice
        options: [monthly, quarterly]
        default: monthly

permissions:
  contents: read
  issues: write

jobs:
  open-issue:
    # The weekly cron is kept for fleet-audit below; no weekly checklist is left.
    if: github.event.schedule != '0 6 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: |
            handbook/cadences.md
            scripts/lib.sh
          sparse-checkout-cone-mode: false
      - name: Read the checklist from the handbook
        env:
          SCHEDULE: ${{ github.event.schedule }}
          CHOSEN: ${{ inputs.cadence }}
        run: |
          case "$SCHEDULE" in
            '0 6 1 * *') cadence=monthly ;;
            '0 6 1 1,4,7,10 *') cadence=quarterly ;;
            '') cadence="$CHOSEN" ;;
            *) echo "::error::unrecognized schedule: $SCHEDULE"; exit 1 ;;
          esac
          # shellcheck source=/dev/null
          . scripts/lib.sh
          cadence_checklist "$cadence" <handbook/cadences.md >"$RUNNER_TEMP/checklist.md"
          if [ ! -s "$RUNNER_TEMP/checklist.md" ]; then
            echo "::error::handbook/cadences.md has no checklist under a '$cadence' heading"
            exit 1
          fi
          echo "CADENCE=$cadence" >>"$GITHUB_ENV"
      - name: Open the cadence issue and close the one before it
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require('fs');
            const cadence = process.env.CADENCE;
            const items = fs.readFileSync(`${process.env.RUNNER_TEMP}/checklist.md`, 'utf8').trim();
            const today = new Date().toISOString().slice(0, 10);
            const title = `Cadence: ${cadence} — ${today}`;
            const { owner, repo } = context.repo;
            const open = (await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', labels: `cadence,${cadence}`, per_page: 100,
            })).filter((issue) => !issue.pull_request);
            if (open.some((issue) => issue.title === title)) {
              core.info(`"${title}" already open — skipping (idempotent).`);
              return;
            }

            const body = [
              `Recurring **${cadence}** maintenance (handbook/cadences.md). Check each item, then close.`,
              '',
              items,
            ].join('\n');
            const { data } = await github.rest.issues.create({
              owner, repo, title, body, labels: ['cadence', cadence],
            });
            core.info(`opened #${data.number}: ${title}`);

            for (const issue of open) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number, body: `Superseded by #${data.number}.`,
              });
              await github.rest.issues.update({
                owner, repo, issue_number: issue.number, state: 'closed', state_reason: 'not_planned',
              });
              core.info(`closed #${issue.number}`);
            }

  # Nothing else in Artemis looks across repos. athena-sync.yml is a reusable workflow that
  # each managed repo calls FOR ITSELF, so a project built without the harness is never
  # examined by anything — launch-start has been unmanaged since 2026-07-04. Weekly only; the
  # monthly and quarterly crons skip it.
  #
  # FLEET_AUDIT_TOKEN, not github.token, and the difference is the whole reason for the guard
  # below: 12 of the owner's 27 repos are private, including 4 of the 8 in scope and `artemis`,
  # which fleet/unmanaged.json acknowledges. A repo-scoped token lists only public repos, so a
  # run under one would drop most findings AND report acknowledged private repos as absent.
  # Wrong in both directions is worse than not running, so without the secret this says so in
  # the run summary and stops. A secret that is set but sees no private repo is the script's
  # to catch: it prints a `config token` line and fails instead of auditing.
  #
  # Not AUTOMATION_TOKEN. That one opens release PRs, so it can write, and this job needs read
  # access to every repo. Widening it would hand write access to all of them for a read-only
  # report. Until 2026-10-13 this job did use it, and it could not see the private repos.
  # FLEET_AUDIT_TOKEN is a fine-grained token: all repositories, Contents read-only.
  fleet-audit:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 6 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Report repos that should be athena-managed and are not
        env:
          GH_TOKEN: ${{ secrets.FLEET_AUDIT_TOKEN }}
        run: |
          set -o pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            # No backticks in these strings: shellcheck reads one inside single quotes as an
            # expression that will not expand (SC2016), and actionlint runs shellcheck over
            # every run block. Four-space indentation is the code block instead.
            {
              echo '### fleet-audit skipped'
              echo
              echo 'No FLEET_AUDIT_TOKEN secret. It needs a token that can see private repos;'
              echo 'auditing with a repo-scoped token reports a half fleet as a whole one.'
              echo
              echo 'Run it locally instead, where gh auth already sees everything:'
              echo
              echo '    bash scripts/fleet-audit.sh'
            } >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          bash scripts/fleet-audit.sh | tee -a "$GITHUB_STEP_SUMMARY"
