name: selftest

# Gates changes to the reusable workflows with the workflows themselves (spec 01 §6.4).
# On any platform PR that touches a workflow, a template, or a fixture: lint EVERY
# workflow with actionlint (so a new reusable workflow can never ship ungated —
# release.yml and preview.yml once did), run ci.yml / ci-python.yml against their
# minimal fixtures via LOCAL references, and render both copier templates and run the
# rendered projects' own gates (the fixtures do NOT cover templates). If a required
# check name is renamed, or the pipeline breaks, this goes red — the interface-freeze
# tripwire (acceptance test 6).

#
# NO `paths:` FILTER, deliberately. A path-filtered workflow does not start at all on a PR
# that misses the filter, so no check reports and a required check waits forever. That is
# why this repo had no required checks while every repo it generates has eight. Running
# every job on every PR costs a few minutes of wall clock and nothing else (this repo is
# public, so Actions minutes are free), and it buys a merge gate on the repo that defines
# the pipeline for the whole fleet.
#
# `selftest-complete` is the ONLY name the ruleset references. Every other job here can be
# renamed, split or added without touching branch protection.

on:
  pull_request:

permissions:
  contents: read

jobs:
  lint-workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: actionlint (syntax + expression + shellcheck for all workflows)
        # False-positive suppressions live in .github/actionlint.yml — the docker
        # action splits `args` on whitespace, so quoted -ignore patterns can't be
        # passed here.
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # 1.7.7
        with:
          args: -color

  # scripts/ had no gate at all until the canary drill's fix PR itself shipped without
  # checks. Gate at warning severity: real problems fail, style notes don't.
  lint-scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker://koalaman/shellcheck@sha256:5dd00cd58babeaa9c2abaa3f454ce75d21d12ae4a36e38c1458e19135fdcc255 # v0.11.0
        with:
          args: >-
            --severity=warning scripts/new-project.sh scripts/setup-machine.sh
            scripts/adopt-project.sh scripts/lib.sh scripts/tests.sh scripts/session-log.sh
            scripts/sandbox-check.sh scripts/fleet-audit.sh scripts/sops-check.sh
            scripts/sops-bootstrap.sh scripts/osv-coverage.sh scripts/template-sync.sh

  # scripts/tests.sh regression-tests the pure logic extracted into scripts/lib.sh — the
  # entry scripts themselves can never run in CI (they create real GitHub repos / mutate
  # the machine). PyYAML is installed explicitly: the tests hard-fail without it rather
  # than pass vacuously, so the dependency must be guaranteed here.
  test-scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install PyYAML
        run: python3 -m pip install pyyaml
      - name: Run the script regression tests
        run: bash scripts/tests.sh

  # observability/ (Grafana dashboard JSON + alert rules YAML) and backups/ (the R2
  # retention policy) live at the platform root, which has no package to run, so
  # nothing gated them — a bad edit could rot silently. Parse every file; finding none
  # in a directory is a failure, so the job can never pass vacuously after a rename.
  lint-configs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install PyYAML
        run: python3 -m pip install pyyaml
      - name: Parse every root config file
        run: |
          python3 - <<'PY'
          import glob, json, sys, yaml
          total = 0
          for directory in ('observability', 'backups'):
              json_files = glob.glob(f'{directory}/**/*.json', recursive=True)
              yaml_files = glob.glob(f'{directory}/**/*.y*ml', recursive=True)
              if not json_files and not yaml_files:
                  sys.exit(f'no {directory} files found - job and directory out of sync')
              for path in json_files:
                  json.load(open(path))
              for path in yaml_files:
                  yaml.safe_load(open(path))
              total += len(json_files) + len(yaml_files)
              print(f'{directory}: {len(json_files)} json + {len(yaml_files)} yaml')
          print(f'parsed {total} file(s)')
          PY
      - name: Check the retention policy's shape
        # This file governs DELETION. A typo like "Expiation" still parses as JSON and
        # would silently disable expiry, so assert the keys R2 actually acts on.
        run: |
          python3 - <<'PY'
          import json, sys
          config = json.load(open('backups/r2-lifecycle.json'))
          rules = config.get('Rules')
          if not isinstance(rules, list) or not rules:
              sys.exit('r2-lifecycle.json: Rules must be a non-empty list')
          prefixes = set()
          for rule in rules:
              for key in ('ID', 'Status', 'Filter', 'Expiration'):
                  if key not in rule:
                      sys.exit(f'r2-lifecycle.json: rule {rule.get("ID")!r} missing {key}')
              if rule['Status'] != 'Enabled':
                  sys.exit(f'r2-lifecycle.json: rule {rule["ID"]!r} is not Enabled')
              days = rule['Expiration'].get('Days')
              if not isinstance(days, int) or days <= 0:
                  sys.exit(f'r2-lifecycle.json: rule {rule["ID"]!r} needs a positive Days')
              prefixes.add(rule['Filter'].get('Prefix'))
          # backup-d1.yml writes to exactly these two prefixes; a rule set that misses
          # one means those objects would never expire.
          if prefixes != {'daily/', 'monthly/'}:
              sys.exit(f'r2-lifecycle.json: prefixes {sorted(prefixes)} != daily/ + monthly/')
          print(f'retention policy OK: {len(rules)} rules covering {sorted(prefixes)}')
          PY

  # security/semgrep/ had no gate: a rule that silently stops matching produces a green
  # scan indistinguishable from a clean one (artemis-js-child-process-exec missed every
  # "node:"-prefixed import this way). `semgrep --test` runs the annotated fixture next to
  # each rule file; rule files without a fixture are skipped, not failed.
  test-semgrep-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SEMGREP_VERSION: '1.168.0' # mirrors the pin in security.yml — keep in sync
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13' # mirrors security.yml; tests.sh asserts they match
      - name: Install semgrep (OSS engine)
        run: pip install "semgrep==${SEMGREP_VERSION}"
      - name: Test the shared rules against their fixtures
        run: semgrep --test --metrics=off security/semgrep
      # One --test run is not enough to see the engine break. Under Python 3.15, semgrep-core
      # 1.168.0 crashed on most invocations ("failed to create domain backup thread"), and a
      # single --test happened to pass on several PRs while `security / semgrep` failed in
      # canary-worker. This is the scan security.yml runs, with the same flags, on the fixture.
      - name: Scan a real project the way security.yml does
        run: semgrep scan --config security/semgrep --error --metrics=off --no-git-ignore selftest-fixture

  # security/gitleaks.toml had no gate at all. A custom rule that stops matching produces a
  # clean scan indistinguishable from a genuinely clean one — exactly how the ntfy rule came
  # to miss every topic shorter than 8 characters. Exact per-rule counts are asserted, so a
  # rule that starts over-matching fails here too.
  test-gitleaks-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: '8.30.1' # mirrors the pin in security.yml — keep in sync
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install gitleaks (verified against published checksums)
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSLf -o "$tarball" "${base}/${tarball}"
          curl -sSLf -o checksums.txt "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${tarball}$" checksums.txt | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          install -m 0755 gitleaks /usr/local/bin/gitleaks
      - name: Assert the custom rules still match their fixture
        run: |
          gitleaks detect --source security/gitleaks-fixtures --config security/gitleaks.toml \
            --no-git --no-banner --report-format json --report-path findings.json || true
          python3 - <<'PY'
          import collections, json, sys
          found = collections.Counter(
              finding['RuleID'] for finding in json.load(open('findings.json'))
              if finding['RuleID'].startswith('artemis-')
          )
          # Only the artemis- rules are asserted: gitleaks' own default ruleset also fires on
          # this fixture, and its rule names move between releases.
          expected = {
              'artemis-age-secret-key': 1,
              'artemis-github-fine-grained-pat': 1,
              'artemis-cloudflare-api-token': 1,
              'artemis-ntfy-topic-url': 2,
          }
          if dict(found) != expected:
              print('custom gitleaks rules changed', file=sys.stderr)
              print(f'  expected: {expected}', file=sys.stderr)
              print(f'  found:    {dict(found)}', file=sys.stderr)
              sys.exit(1)
          print('custom rules match the fixture:', dict(found))
          PY

  # security.yml's osv coverage steps run only in consumer repos, and only after a release
  # moves v1, so a step that misread the scanner's output would fail every PR in the fleet at
  # once. These are the same two steps against the fixtures' lockfiles, with the same scanner
  # pin; tests.sh asserts the pin and arguments match. A scanner bump that changes the JSON
  # or the flags fails here, on the platform PR that carries it.
  test-osv-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: List every package osv-scanner reads
        # Exits 1 on any advisory; only the package list matters here.
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --format=json
            --all-packages
            --output-file=.artemis-osv-packages.json
            --recursive
            ./
      - name: Verify osv-scanner read every lockfile
        run: bash scripts/osv-coverage.sh .artemis-osv-packages.json

  # template-sync.yml carries every template change into existing repos with copier update, so
  # the question for each template change is whether a repo generated from the last release
  # can take it. This renders that release, syncs it to this commit with the same script, and
  # runs the result's gates. A change that conflicts or breaks an upgraded repo fails here,
  # instead of in a sync PR in every repo of the fleet.
  test-template-sync:
    strategy:
      fail-fast: false
      matrix:
        template: [cf-worker-app, py-tool]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # copier renders from git refs, and the last release is a tag
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Render the last release, then sync it to this commit
        env:
          TEMPLATE: ${{ matrix.template }}
        run: |
          # shellcheck source=/dev/null
          . scripts/lib.sh
          previous="$(git tag --list 'v*' | newest_release_tag)"
          if [ -z "$previous" ]; then
            echo "::error::no vX.Y.Z tag to render the last release from"
            exit 1
          fi
          printf '%s\n' "template: $TEMPLATE" 'project_name: sync-check' \
            'description: selftest template sync' 'visibility: public' > "$RUNNER_TEMP/answers.yml"
          uvx --from copier copier copy --quiet --defaults --vcs-ref "$previous" \
            --data-file "$RUNNER_TEMP/answers.yml" "$GITHUB_WORKSPACE" synced
          git -C synced init -q
          git -C synced add -A
          git -C synced -c user.name=selftest -c user.email=selftest@invalid commit -qm render
          result="$(bash scripts/template-sync.sh HEAD synced)"
          echo "$result"
          case "$result" in
            updated*) ;;
            *) echo "::error::syncing $previous to this commit did not apply cleanly: $result"; exit 1 ;;
          esac
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: matrix.template == 'cf-worker-app'
        with:
          package_json_file: synced/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: matrix.template == 'cf-worker-app'
        with:
          node-version: '24'
      - name: Run the synced project's gates
        working-directory: synced
        run: |
          if [ -f package.json ]; then
            pnpm install
            pnpm lint
            pnpm typecheck
            pnpm test
          else
            uv sync
            uv run ruff check .
            uv run ruff format --check .
            uv run pyright
            uv run pytest --cov
          fi

  ci:
    uses: ./.github/workflows/ci.yml
    with:
      working-directory: selftest-fixture

  # enforce-conventional-commits is left to the ci job above so commitlint runs once.
  ci-python:
    uses: ./.github/workflows/ci-python.yml
    with:
      working-directory: selftest-fixture-py
      enforce-conventional-commits: false

  # Render each template with every feature ON and run the rendered project's own
  # gates. This is what catches a template bug (bad jinja, broken wrangler config,
  # failing generated test) before a real project is generated from it.
  render-cf-worker-app:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # copier renders from the git HEAD, not the working tree
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Render the template (all features on)
        run: |
          cat > "$RUNNER_TEMP/answers.yml" <<'EOF'
          template: cf-worker-app
          project_name: render-check
          description: selftest render of cf-worker-app
          visibility: public
          bindings: [kv, d1, r2, queues]
          needs_scheduled_jobs: true
          public_forms: true
          EOF
          uvx --from copier copier copy --defaults --vcs-ref HEAD \
            --data-file "$RUNNER_TEMP/answers.yml" . render-out
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: render-out/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - name: Run the rendered project's gates
        working-directory: render-out
        # No lockfile ships in the template (new-project.sh generates it), so this
        # install is deliberately un-frozen. `pnpm build` is wrangler's dry-run
        # deploy — it validates the rendered wrangler.jsonc and bundles the Worker.
        run: |
          pnpm install
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm run test:mutation
          pnpm build
      - name: Assert the Workers fitness rules reject a violation
        working-directory: render-out
        # `pnpm lint` passing above only proves the config parses, because the template's
        # own sources are clean. This is the negative half, modelled on test-gitleaks-rules:
        # each probe must be rejected BY NAME. Asserting on the exit code alone would let a
        # stray formatting error stand in for the import rule actually firing.
        run: |
          set -u
          status=0
          probe() {
            printf '%s\n' "$2" > src/fitness-probe.ts
            if pnpm lint 2>&1 | grep -q "$3"; then
              echo "ok:   $1 rejected by $3"
            else
              echo "::error::$1 was not rejected by $3"
              status=1
            fi
            rm -f src/fitness-probe.ts
          }
          probe 'node: built-in import' \
            "import { readFileSync } from 'node:fs'; export const p = (f: string): string => readFileSync(f, 'utf8');" \
            noRestrictedImports
          probe 'bare built-in import' \
            "import { join } from 'path'; export const p = (f: string): string => join(f, 'x');" \
            noRestrictedImports
          probe 'process.env access' \
            "export const s = (): string | undefined => process.env.SECRET;" \
            noProcessEnv
          exit "$status"

  # The all-features render never exercises the OFF paths. A conditional FILENAME like
  # `{% if visibility == 'public' %}codeql.yml{% endif %}` renders to an empty name and is
  # skipped, so a mistake in that expression is invisible until a real project is
  # generated from the template. This renders the opposite corner — private, no bindings,
  # no cron, no forms — asserts each conditional file is absent, and runs the gates,
  # because a Worker with no bindings is a different wrangler.jsonc and a different index.ts.
  render-cf-worker-app-minimal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # copier renders from the git HEAD, not the working tree
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Render the template (private, every feature off)
        run: |
          cat > "$RUNNER_TEMP/answers-minimal.yml" <<'EOF'
          template: cf-worker-app
          project_name: render-check-minimal
          description: selftest render of cf-worker-app with every option off
          visibility: private
          bindings: []
          needs_scheduled_jobs: false
          public_forms: false
          EOF
          uvx --from copier copier copy --defaults --vcs-ref HEAD \
            --data-file "$RUNNER_TEMP/answers-minimal.yml" . render-min
      - name: Assert every conditional file is absent
        run: |
          rendered=0
          for path in \
            .github/workflows/codeql.yml \
            .github/workflows/backup.yml \
            src/lib/turnstile.ts \
            tests/turnstile.test.ts \
            LICENSE
          do
            if [ -e "render-min/$path" ]; then
              echo "::error::$path rendered even though its condition is false"
              rendered=1
            fi
          done
          exit "$rendered"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: render-min/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - name: Run the rendered project's gates
        working-directory: render-min
        # Un-frozen install for the same reason as the all-features render: templates
        # ship no lockfile.
        run: |
          pnpm install
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm run test:mutation
          pnpm build

  render-py-tool:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # copier renders from the git HEAD, not the working tree
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: '3.13'
      - name: Render the template
        run: |
          cat > "$RUNNER_TEMP/answers.yml" <<'EOF'
          template: py-tool
          project_name: render-check-py
          description: selftest render of py-tool
          visibility: public
          EOF
          uvx --from copier copier copy --defaults --vcs-ref HEAD \
            --data-file "$RUNNER_TEMP/answers.yml" . render-out
      - name: Run the rendered project's gates
        working-directory: render-out
        run: |
          uv sync
          uv run ruff check .
          uv run ruff format --check .
          uv run pyright
          # --cov, matching ci-python.yml: the coverage floor lives in
          # [tool.coverage.report], not in pytest addopts, so `pytest -q` alone would not
          # enforce it here.
          uv run pytest --cov
          uv run python scripts/mutation.py
      - name: Assert the Python fitness rules reject a violation
        working-directory: render-out
        # `ruff check` passing above only proves the config parses, because the template's own
        # sources are clean. This is the negative half, matching the cf-worker-app render and
        # test-gitleaks-rules: each probe must be rejected BY CODE. Asserting on the exit code
        # alone would let an unrelated finding stand in for the rule actually firing.
        run: |
          set -u
          status=0
          pkg="src/$(echo 'render-check-py' | tr '-' '_')"
          probe() {
            printf '%s\n' "$2" > "$3/fitness_probe.py"
            if uv run ruff check "$3/fitness_probe.py" 2>&1 | grep -q "$4"; then
              echo "ok:   $1 rejected by $4"
            else
              echo "::error::$1 was not rejected by $4"
              status=1
            fi
            rm -f "$3/fitness_probe.py"
          }
          probe 'unannotated signature' 'def compute(value):
              return value' "$pkg" ANN001
          probe 'Any where a type belongs' 'from typing import Any


          def compute(value: Any) -> Any:
              return value' "$pkg" ANN401
          probe 'CamelCase function' 'def ComputeThing() -> None:
              return None' "$pkg" N802
          # Annotations are deliberately not required in tests, so a test that would trip
          # ANN must pass. A per-file-ignore that silently stopped applying would otherwise
          # look identical to one that works.
          printf 'def unannotated_helper(value):\n    return value\n' > tests/fitness_probe.py
          if uv run ruff check tests/fitness_probe.py 2>&1 | grep -q ANN; then
            echo '::error::tests/ is still subject to ANN, so the per-file-ignore is not applying'
            status=1
          else
            echo 'ok:   tests/ exempt from ANN, as configured'
          fi
          rm -f tests/fitness_probe.py
          exit "$status"
      # py-tool's only visibility-dependent output is which files exist, so a private
      # render needs the absence assertion but not a second full gate run.
      - name: Render privately and assert the public-only files are absent
        run: |
          cat > "$RUNNER_TEMP/answers-private.yml" <<'EOF'
          template: py-tool
          project_name: render-check-py-private
          description: selftest render of py-tool as a private repo
          visibility: private
          EOF
          uvx --from copier copier copy --defaults --vcs-ref HEAD \
            --data-file "$RUNNER_TEMP/answers-private.yml" . render-out-private
          rendered=0
          for path in .github/workflows/codeql.yml LICENSE; do
            if [ -e "render-out-private/$path" ]; then
              echo "::error::$path rendered even though the repo is private"
              rendered=1
            fi
          done
          exit "$rendered"

  # The single required check: one stable name standing in for every job above, so the
  # ruleset never has to know what this workflow is made of. `if: always()` so it still
  # reports when a dependency fails, is cancelled or is skipped; the loop below is what
  # turns any of those into a red gate. `needs` must list every job: one left out is
  # silently ungated, which is the failure this job exists to prevent.
  selftest-complete:
    needs:
      - lint-workflows
      - lint-scripts
      - test-scripts
      - lint-configs
      - test-semgrep-rules
      - test-gitleaks-rules
      - test-osv-coverage
      - test-template-sync
      - ci
      - ci-python
      - render-cf-worker-app
      - render-cf-worker-app-minimal
      - render-py-tool
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail unless every selftest job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "selftest job results: $RESULTS"
          failed=0
          for result in $RESULTS; do
            if [ "$result" != 'success' ]; then
              echo "::error::a selftest job reported '$result' - see the failing job above"
              failed=1
            fi
          done
          exit "$failed"
