name: semgrep-experiment

# TEMPORARY. Measures whether semgrep-core's "failed to create domain backup thread" crash
# follows the Python version or the -j setting. Removed before this PR leaves draft.

on:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    strategy:
      fail-fast: false
      matrix:
        python: ['3.13', '3.15']
        jobs: ['default', '1']
        attempt: [1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install semgrep
        run: pip install "semgrep==1.168.0"
      - name: Machine
        run: |
          echo "nproc=$(nproc)"
          ulimit -a | grep -E 'stack|processes|virtual'
          grep -E 'MemTotal|MemAvailable' /proc/meminfo
          cat /proc/sys/vm/overcommit_memory
      - name: Scan
        env:
          JOBS: ${{ matrix.jobs }}
        run: |
          extra=()
          if [ "$JOBS" = 1 ]; then extra=(-j 1); fi
          semgrep scan --config security/semgrep --error --metrics=off --no-git-ignore \
            "${extra[@]}" selftest-fixture
          semgrep --test --metrics=off "${extra[@]}" security/semgrep
