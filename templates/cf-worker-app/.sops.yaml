# SOPS encryption rules. Encrypt files under secrets/ before committing them.
#
# Replace the placeholder with this project's age public recipient before use.
# Until encryption is configured and verified, do not commit files under secrets/.
# Pattern-based secret scanners cannot prove that a file contains no sensitive values.
creation_rules:
  - path_regex: secrets/.*\.(env|json|yaml)$
    age: age1PLACEHOLDER0000000000000000000000000000000000000000000000000000
