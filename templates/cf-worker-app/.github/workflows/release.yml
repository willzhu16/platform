name: release

# Started only by dispatch on a tag ref: release-please.yml hands over each new tag this way,
# and the rollback runbook redeploys an earlier one. A `push: tags` trigger as well would run
# every release twice when release-please tags with AUTOMATION_TOKEN.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: vX.Y.Z tag to build and deploy (release-please passes the new one)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    uses: willzhu16/platform/.github/workflows/release.yml@v1
    with:
      tag: ${{ inputs.tag || '' }}
      deploy: true
    # The value comes from this repo's `production` environment, but GitHub hands a reusable
    # workflow only the secrets its caller names, so name it here.
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
