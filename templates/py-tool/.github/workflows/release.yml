name: release

# Started only by dispatch on a tag ref: release-please.yml hands over each new tag this way.
# A `push: tags` trigger as well would run every release twice when release-please tags with
# AUTOMATION_TOKEN.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: vX.Y.Z tag to build the artifact for (release-please passes the new one)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    uses: willzhu16/platform/.github/workflows/release.yml@v1
    with:
      tag: ${{ inputs.tag || '' }}
      language: python
