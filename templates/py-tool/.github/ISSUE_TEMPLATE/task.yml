name: Task packet
description: A reviewable unit of agent work (athena spec 04)
labels: [task]
body:
  - type: input
    id: goal
    attributes:
      label: Goal
      description: One sentence, outcome not activity.
    validations:
      required: true
  - type: textarea
    id: non-goals
    attributes:
      label: Non-goals
      description: Files/behaviours the agent must NOT touch. At least one entry — an empty field means the packet is not ready.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: >-
        Observable checks, one per line, each with a stable id. A test claims one by naming
        it — `AC-1:` in a TypeScript test name, `test_ac_1_...` in Python — so the build can
        fail for any criterion nothing covers. Leave the id off a criterion that can only be
        checked by hand, and say in the PR how you checked it.
      placeholder: |
        - AC-1: an expired token is rejected with a 401 rather than a 500
        - AC-2: the retry stops after three attempts
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints
      description: Applicable ADRs/DECISIONS by ID; performance/security notes.
  - type: textarea
    id: pointers
    attributes:
      label: Pointers
      description: Paths and links only — never pasted file contents.
  - type: input
    id: done
    attributes:
      label: Done means
      value: All checks in spec 01/02 green + every acceptance criterion demonstrated.
